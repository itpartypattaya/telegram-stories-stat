<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520">
<style>text{font-family:'JetBrains Mono','DejaVu Sans Mono','Consolas','Menlo',monospace;}</style>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="a-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker><marker id="b-primary" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#22d3ee"/></marker><marker id="a-secondary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker><marker id="b-secondary" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#34d399"/></marker><marker id="a-tertiary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker><marker id="b-tertiary" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#a78bfa"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker><marker id="b-accent" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#fbbf24"/></marker><marker id="a-alert" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker><marker id="b-alert" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#fb7185"/></marker><marker id="a-neutral" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker><marker id="b-neutral" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#94a3b8"/></marker><marker id="a-highlight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/></marker><marker id="b-highlight" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#60a5fa"/></marker></defs>
<rect width="940" height="520" fill="#0f172a"/><rect width="940" height="520" fill="url(#grid)"/>
<text x="30" y="40" fill="white" font-size="17" font-weight="700">Автосообщения: жизнь правила и предохранители</text>
<text x="30" y="61" fill="#94a3b8" font-size="10.5">выключено по умолчанию · ничего не уйдёт, пока владелец не подтвердит ровно то, что показал превью</text>
<path d="M 150 162 L 150 194" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#a-accent)"/>
<path d="M 150 258 L 150 290" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#a-secondary)"/><text x="160" y="280" fill="#34d399" font-size="9" text-anchor="start">владелец сказал «да»</text>
<path d="M 150 354 L 150 386" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<path d="M 270 227 L 310 227 L 310 131 L 272 131" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#a-neutral)"/><text x="318" y="182" fill="#94a3b8" font-size="9" text-anchor="start">любая правка → снова shadow</text>
<path d="M 270 323 L 520 323" fill="none" stroke="#fb7185" stroke-width="1.6" marker-end="url(#a-alert)"/>
<rect x="30" y="100" width="240" height="62" rx="6" fill="#0f172a"/><rect x="30" y="100" width="240" height="62" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="121.0" fill="white" font-size="12" font-weight="600" text-anchor="middle">draft → shadow</text><text x="150.0" y="137.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">пишет, кому БЫ ушло</text><text x="150.0" y="150.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">ничего не шлёт</text>
<rect x="30" y="196" width="240" height="62" rx="6" fill="#0f172a"/><rect x="30" y="196" width="240" height="62" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="150.0" y="217.0" fill="white" font-size="12" font-weight="600" text-anchor="middle">preview</text><text x="150.0" y="233.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">текст · охват · лимиты</text><text x="150.0" y="246.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">прогон + дайджест</text>
<rect x="30" y="292" width="240" height="62" rx="6" fill="#0f172a"/><rect x="30" y="292" width="240" height="62" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="150.0" y="313.0" fill="white" font-size="12" font-weight="600" text-anchor="middle">active</text><text x="150.0" y="329.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">rule activate N</text><text x="150.0" y="342.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">--confirm &lt;дайджест&gt;</text>
<rect x="30" y="388" width="240" height="62" rx="6" fill="#0f172a"/><rect x="30" y="388" width="240" height="62" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="409.0" fill="white" font-size="12" font-weight="600" text-anchor="middle">paused / done</text><text x="150.0" y="425.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">владельцем или само</text><text x="150.0" y="438.0" fill="#94a3b8" font-size="9.5" text-anchor="middle">при проблемах</text>
<rect x="522" y="100" width="388" height="350" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
<text x="540" y="126" fill="white" font-size="12" font-weight="600">Проверяется перед КАЖДЫМ сообщением</text>
<circle cx="546" cy="150" r="3" fill="#fb7185"/>
<text x="558" y="154" fill="#e2e8f0" font-size="10.5">autoresponder.enabled = true</text>
<circle cx="546" cy="176" r="3" fill="#fb7185"/>
<text x="558" y="180" fill="#e2e8f0" font-size="10.5">стоп-кран: stories.py stop</text>
<circle cx="546" cy="202" r="3" fill="#fb7185"/>
<text x="558" y="206" fill="#e2e8f0" font-size="10.5">охват: по умолчанию контакты</text>
<circle cx="546" cy="228" r="3" fill="#fb7185"/>
<text x="558" y="232" fill="#e2e8f0" font-size="10.5">список never_message</text>
<circle cx="546" cy="254" r="3" fill="#fb7185"/>
<text x="558" y="258" fill="#e2e8f0" font-size="10.5">не боты, не удалённые, не блок</text>
<circle cx="546" cy="280" r="3" fill="#fb7185"/>
<text x="558" y="284" fill="#e2e8f0" font-size="10.5">берёт звёзды → пропуск, не платим</text>
<circle cx="546" cy="306" r="3" fill="#fb7185"/>
<text x="558" y="310" fill="#e2e8f0" font-size="10.5">1 сообщение человеку на правило</text>
<circle cx="546" cy="332" r="3" fill="#fb7185"/>
<text x="558" y="336" fill="#e2e8f0" font-size="10.5">7 дней тишины между правилами</text>
<circle cx="546" cy="358" r="3" fill="#fb7185"/>
<text x="558" y="362" fill="#e2e8f0" font-size="10.5">40/день контакты · 10/день все</text>
<circle cx="546" cy="384" r="3" fill="#fb7185"/>
<text x="558" y="388" fill="#e2e8f0" font-size="10.5">15/час · тихие часы 22–09</text>
<circle cx="546" cy="410" r="3" fill="#fb7185"/>
<text x="558" y="414" fill="#e2e8f0" font-size="10.5">PEER_FLOOD → стоп всего</text>
<text x="30" y="482" fill="#94a3b8" font-size="10">человек скрыл ваши сторис после сообщения → правило на паузу</text>
</svg>