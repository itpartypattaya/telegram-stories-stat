<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="a-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker><marker id="b-primary" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#22d3ee"/></marker><marker id="a-secondary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker><marker id="b-secondary" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#34d399"/></marker><marker id="a-tertiary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker><marker id="b-tertiary" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#a78bfa"/></marker><marker id="a-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker><marker id="b-accent" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#fbbf24"/></marker><marker id="a-alert" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker><marker id="b-alert" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#fb7185"/></marker><marker id="a-neutral" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker><marker id="b-neutral" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#94a3b8"/></marker><marker id="a-highlight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/></marker><marker id="b-highlight" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#60a5fa"/></marker></defs>
<rect width="940" height="470" fill="#0f172a"/><rect width="940" height="470" fill="url(#grid)"/>
<text x="30" y="40" fill="white" font-size="17" font-weight="700">A story's life in the database</text>
<text x="30" y="61" fill="#94a3b8" font-size="10.5">what the service does by itself, minute by minute — nobody has to ask</text>
<path d="M 290 143 L 338 143" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#a-secondary)"/>
<path d="M 600 143 L 648 143" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#a-secondary)"/>
<path d="M 780 176 L 780 258" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a-tertiary)"/>
<path d="M 650 293 L 602 293" fill="none" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#a-highlight)"/>
<path d="M 340 293 L 292 293" fill="none" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#a-highlight)"/>
<path d="M 760 110 L 760 96 L 470 96 L 470 108" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#a-neutral)"/><text x="615" y="90" fill="#94a3b8" font-size="9" text-anchor="middle">no → wait a minute</text>
<rect x="30" y="110" width="260" height="66" rx="6" fill="#0f172a"/><rect x="30" y="110" width="260" height="66" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="160.0" y="139.5" fill="white" font-size="12" font-weight="600" text-anchor="middle">You post a story</text><text x="160.0" y="155.5" fill="#94a3b8" font-size="9.5" text-anchor="middle">t = 0</text>
<rect x="340" y="110" width="260" height="66" rx="6" fill="#0f172a"/><rect x="340" y="110" width="260" height="66" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/><text x="470.0" y="139.5" fill="white" font-size="12" font-weight="600" text-anchor="middle">Counters, every 60 s</text><text x="470.0" y="155.5" fill="#94a3b8" font-size="9.5" text-anchor="middle">one request for all</text>
<rect x="650" y="110" width="260" height="66" rx="6" fill="#0f172a"/><rect x="650" y="110" width="260" height="66" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="780.0" y="139.5" fill="white" font-size="12" font-weight="600" text-anchor="middle">Views grew?</text><text x="780.0" y="155.5" fill="#94a3b8" font-size="9.5" text-anchor="middle">read the viewer list</text>
<rect x="650" y="260" width="260" height="66" rx="6" fill="#0f172a"/><rect x="650" y="260" width="260" height="66" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="780.0" y="289.5" fill="white" font-size="12" font-weight="600" text-anchor="middle">Saved</text><text x="780.0" y="305.5" fill="#94a3b8" font-size="9.5" text-anchor="middle">who · when · reaction</text>
<rect x="340" y="260" width="260" height="66" rx="6" fill="#0f172a"/><rect x="340" y="260" width="260" height="66" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/><text x="470.0" y="289.5" fill="white" font-size="12" font-weight="600" text-anchor="middle">Pulse at +2 h</text><text x="470.0" y="305.5" fill="#94a3b8" font-size="9.5" text-anchor="middle">vs your usual, same age</text>
<rect x="30" y="260" width="260" height="66" rx="6" fill="#0f172a"/><rect x="30" y="260" width="260" height="66" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/><text x="160.0" y="289.5" fill="white" font-size="12" font-weight="600" text-anchor="middle">Digest</text><text x="160.0" y="305.5" fill="#94a3b8" font-size="9.5" text-anchor="middle">Sunday 20:00 · 1st of month</text>
<text x="790" y="200" fill="#c4b5fd" font-size="9" text-anchor="start">newest first, stops at the</text>
<text x="790" y="213" fill="#c4b5fd" font-size="9" text-anchor="start">first viewer already stored</text>
<text x="30" y="368" fill="#94a3b8" font-size="10">after 48 h: profile (pinned) stories keep collecting, checked every 30 min</text>
<rect x="30" y="388" width="880" height="56" rx="6" fill="#0f172a"/><rect x="30" y="388" width="880" height="56" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="470.0" y="412.5" fill="white" font-size="11.5" font-weight="600" text-anchor="middle">Once at install: the whole history Telegram still keeps</text><text x="470.0" y="428.5" fill="#94a3b8" font-size="9.5" text-anchor="middle">209 stories since 07.2023 · 30 110 views · ~15 min · resumable</text>
</svg>